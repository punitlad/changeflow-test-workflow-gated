# Option C's entire trust mechanism: allow-list changeflow's App bot identity by *author*,
# not by label or title (see api-repo/README.md "Watch out for"), and merge it ourselves.
# changeflow's merge_strategies.WorkflowGatedMerge does nothing but wait -- this workflow
# is the thing doing the merge.
#
# Confirmed by a real PR: the bot login below (my-changeflow-app[bot]) matches.
#
# Triggered on ci.yml's completion, not on pull_request_target at PR-open time. setup.sh now
# creates the same branch ruleset base-repo and native-auto-merge give humans (PR + required
# "validate" check, no bypass actor) -- restoring the protection this mode used to skip
# entirely. Merging on pull_request_target: [opened, ...] would race that check: the PR is
# often not green yet, and the merge attempt would 422 against the ruleset. Waiting for
# workflow_run: [completed] guarantees "validate" already passed before we try.
#
# NOTE: a workflow_run listener always runs the version of ITSELF committed on the default
# branch (main), not the one in the PR -- a GitHub quirk, not a bug here, but worth knowing
# if you edit this file and wonder why a PR's run didn't pick up your change.
#
# NOTE: `gh pr view --json author` (GraphQL-backed) renders a bot's login as "app/<slug>",
# NOT "<slug>[bot]" -- that suffix convention is from the REST API / webhook actor fields
# (github.actor, github.event.pull_request.user.login), which is what ci.yml and this
# workflow's own `if:` elsewhere in this repo set compare against. Found by running this for
# real: the first version of this step compared against "my-changeflow-app[bot]" and silently
# treated the App's own PR as a human's, every time.
#
# IMPORTANT: the merge step uses secrets.MERGE_TOKEN (a PAT), not the default
# secrets.GITHUB_TOKEN. Merges/pushes made with the default GITHUB_TOKEN do NOT trigger
# other workflows (GitHub's loop-prevention) -- so deploy.yml would never fire on the
# merge commit, and changeflow's find_run() would time out waiting for a push-triggered
# run that never happens. Set MERGE_TOKEN as a repo secret to a PAT with repo+workflow
# scope: `gh secret set MERGE_TOKEN -R <owner>/<repo>`.
name: auto-merge-changeflow-prs
on:
  workflow_run:
    workflows: ["ci"]
    types: [completed]

jobs:
  merge:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.MERGE_TOKEN }}
    steps:
      - name: Find the PR this run validated
        id: pr
        run: |
          number=$(gh api "repos/${{ github.repository }}/commits/${{ github.event.workflow_run.head_sha }}/pulls" --jq '.[0].number // empty')
          echo "number=$number" >> "$GITHUB_OUTPUT"

      - name: Merge if opened by changeflow
        if: steps.pr.outputs.number != ''
        run: |
          author=$(gh pr view "${{ steps.pr.outputs.number }}" -R "${{ github.repository }}" --json author --jq .author.login)
          if [ "$author" = "app/my-changeflow-app" ]; then
            gh pr merge --squash -R "${{ github.repository }}" "${{ steps.pr.outputs.number }}"
          else
            echo "PR #${{ steps.pr.outputs.number }} author is $author, not the app; leaving it for a human to merge"
          fi
