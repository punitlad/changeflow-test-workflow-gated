# Option C's entire trust mechanism: allow-list changeflow's App bot identity by *author*,
# not by label or title (see api-repo/README.md "Watch out for"), and merge it ourselves.
# changeflow's merge_strategies.WorkflowGatedMerge does nothing but wait -- this workflow
# is the thing doing the merge.
#
# Confirmed by a real PR: the bot login below (my-changeflow-app[bot]) matches.
#
# IMPORTANT: the merge step uses secrets.MERGE_TOKEN (a PAT), not the default
# secrets.GITHUB_TOKEN. Merges/pushes made with the default GITHUB_TOKEN do NOT trigger
# other workflows (GitHub's loop-prevention) -- so deploy.yml would never fire on the
# merge commit, and changeflow's find_run() would time out waiting for a push-triggered
# run that never happens. Set MERGE_TOKEN as a repo secret to a PAT with repo+workflow
# scope: `gh secret set MERGE_TOKEN -R <owner>/<repo>`.
name: auto-merge-changeflow-prs
on:
  pull_request_target:
    types: [opened, reopened, synchronize]

permissions:
  contents: write
  pull-requests: write

jobs:
  merge:
    if: github.event.pull_request.user.login == 'my-changeflow-app[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Merge PR opened by changeflow
        env:
          GH_TOKEN: ${{ secrets.MERGE_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr merge --squash "$PR_URL"
